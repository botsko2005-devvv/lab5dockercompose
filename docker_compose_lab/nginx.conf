server {
    # Nginx слухає порт 80 всередині контейнера
    listen 80;
    server_name localhost;

    # Коренева папка сайту (сюди монтується ./app)
    root /var/www/html;
    # Файли, які відкриваються за замовчуванням
    index index.php index.html;

    location / {
        # Віддаємо файл, а якщо його немає - помилка 404
        try_files $uri $uri/ =404;
    }

    # Усі запити до .php-файлів
    location ~ \.php$ {
        include fastcgi_params;
        # Передаємо PHP-запити в контейнер php на порт 9000 (PHP-FPM)
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        # Повний шлях до PHP-файлу, який потрібно виконати
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
